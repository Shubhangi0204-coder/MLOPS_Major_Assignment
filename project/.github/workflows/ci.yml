name: CI - train and test (single-job)

on:
  push:
    branches:
      - dev

jobs:
  train_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Show repo layout
        run: |
          echo "Repo root:"
          ls -la
          echo "project dir:"
          ls -la project || true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f project/requirements.txt ]; then pip install -r project/requirements.txt; fi

      - name: Train model
        run: |
          # ensure artifact folder exists and model saved there
          mkdir -p artifacts
          # run training script (adjust path if yours is project/train.py)
          python project/train_model.py --output artifacts/savedmodel.pth || python project/train.py --output artifacts/savedmodel.pth || python train_model.py --output artifacts/savedmodel.pth || python train.py --output artifacts/savedmodel.pth

      - name: Run tests
        run: |
          ls -la artifacts
          python test.py
