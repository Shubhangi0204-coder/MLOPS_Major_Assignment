name: CI - train and test (single job)

on:
  push:
    branches:
      - dev

jobs:
  train_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Show repo tree
        run: |
          echo "Repo root:" && ls -la
          echo "project dir (if present):" && ls -la project || true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f project/requirements.txt ]; then pip install -r project/requirements.txt; fi
          python -c "import sklearn, joblib, numpy, sys; print('sklearn', sklearn.__version__); print('joblib', joblib.__version__); print('numpy', numpy.__version__)"

      - name: Train model (write artifact)
        run: |
          mkdir -p artifacts
          python project/train_model.py --output artifacts/savedmodel.pth || python project/train.py --output artifacts/savedmodel.pth || python train_model.py --output artifacts/savedmodel.pth || python train.py --output artifacts/savedmodel.pth
          ls -la artifacts

      - name: Run tests (load same artifact)
        run: |
          echo "Artifacts present:" && ls -la artifacts
          python test.py

